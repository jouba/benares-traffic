name: Simulazione Traffico Benares

on:
  schedule:
    - cron: '7 2 * * *'   # 02:07
    - cron: '34 8 * * *'  # 08:34
    - cron: '51 14 * * *' # 14:51
    - cron: '22 20 * * *' # 20:22
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test proxy connection
      run: |
        echo "🔍 Test proxy da GitHub Actions..."
        curl -x http://${{ secrets.PROXY_USERNAME }}:${{ secrets.PROXY_PASSWORD }}@${{ secrets.PROXY_HOST }}:${{ secrets.PROXY_PORT }} \
             -I https://www.google.com --max-time 10 || echo "❌ Proxy fallito"
        
        echo "🔍 Test sito senza proxy..."
        curl -I https://www.benaresfilm.com --max-time 10 || echo "❌ Sito non raggiungibile"
    
    - name: Checkout repository
      uses: actions/checkout@v6
    
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps
    
    - name: Run simulation
      run: python simulate.py
      env:
        SERP_API_KEY: ${{ secrets.SERP_API_KEY }}
        PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
        PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        PROXY_HOST: ${{ secrets.PROXY_HOST }}
        PROXY_PORT: ${{ secrets.PROXY_PORT }}
        MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
    
    - name: Upload logs (if failed)
      if: failure()
      uses: actions/upload-artifact@v6  # Aggiornato a v6 (Node.js 24)
      with:
        name: logs
        path: |
          *.log
          *.txt
